server:
  port: 8080

spring:
  application:
    name: bancoias-backend
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:bancoias}
    username: ${DB_USER:bancoias}
    password: ${DB_PASSWORD}
    pool:
      initial-size: 2
      max-size: 20

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
